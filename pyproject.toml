[project]
name = "walter"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "ipykernel>=7.2.0",
    "pandas>=2.2,<3",
    "numpy<2",
    "pyarrow>=24.0.0",
    "rapidfuzz>=3.14.5",
    "ipywidgets>=8.1.8",
    "scikit-learn>=1.8.0",
    "jellyfish>=1.2.1",
    "phonemizer>=3.3.0",
    "openai>=2.38.0",
    "rich>=13.7",
    "phonetisaurus>=0.3.0",
]

[project.optional-dependencies]
llm = [
    "transformers==4.45.2",
    "accelerate==0.33.0",
    "torch>=2.1",
]
api = [
    "openai>=1.0",
]

[project.scripts]
walter = "walter:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["walter"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
