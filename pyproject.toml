[project]
name = "walter"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "ipykernel>=7.2.0",
    "pandas>=2.2,<3",
    "numpy<2",
    "pyarrow>=24.0.0",
]

[project.optional-dependencies]
llm = [
    "transformers==4.45.2",
    "accelerate==0.33.0",
    "torch>=2.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
