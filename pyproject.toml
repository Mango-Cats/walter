[project]
name = "walter"
version = "0.1.0"
description = "LLM-assisted dataset construction for LASA drugs. 'Walter are these two LASA drugs? Make no mistakes.'"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.2.0",
    "pandas>=3.0.2",
    "pathlib>=1.0.1",
]

[project.optional-dependencies]
hf = ["torch", "transformers", "accelerate"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
