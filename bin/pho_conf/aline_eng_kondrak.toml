algorithm = "aline"
# English-phonology counterpart of aline_ph_kondrak.toml.
#
# Same ALINE algorithm, same costs, same salience weights, same [values.*]
# scales, same segment inventory - the only difference is that each segment is
# described the way English realizes it rather than the way Tagalog does. A gap
# between aline_eng_* and aline_ph_* on the same transcription is therefore
# attributable to the phonology, not to a re-tuned weighting.
#
# Both are applied to both transcriptions, giving four columns:
#   aline_eng_kondrak_eng   English tables, English IPA
#   aline_eng_kondrak_fil   English tables, Filipino IPA
#   aline_ph_kondrak_eng    Tagalog tables, English IPA
#   aline_ph_kondrak_fil    Tagalog tables, Filipino IPA
#
# Segment descriptions referenced from:
# 1. A Course in Phonetics - Ladefoged & Johnson (English consonant and vowel charts)
# 2. Accents of English - Wells 1982 (lexical sets: KIT, TRAP, STRUT, THOUGHT, ...)
# 3. Handbook of the IPA - International Phonetic Association 1999 (English illustration)
# 4. The Sounds of the World's Languages - Ladefoged & Maddieson 1996 (phonation continuum)
#
# Segments Tagalog and English describe identically are left untouched, so this
# file diverges from aline_ph_kondrak.toml only where a comment says so. It is
# generated - see the OVERRIDES table in the generator for the full diff.

# ================================ FEATURES ================================
variant = "kondrak"
epsilon = 0.001

[costs]
skip            = -10
substitute      = 35
expand_compress = 45
vowel_consonant = 5

[salience]
syllabic  = 5
place     = 40
manner    = 50
voice     = 5
nasal     = 20
retroflex = 10
lateral   = 10
aspirated = 5
long      = 0
high      = 3
back      = 2
round     = 2
phonation = 10
airstream = 10
secondary = 10

[values.place]
bilabial        = 1.0
labiodental     = 0.95
linguolabial    = 0.92
dental          = 0.9
alveolar        = 0.85
retroflex       = 0.8
palato_alveolar = 0.75
alveolo_palatal = 0.72
palatal         = 0.7
velar           = 0.6
uvular          = 0.5
pharyngeal      = 0.3
epiglottal      = 0.2
glottal         = 0.1
labiovelar      = 1.0
vowel           = -1.0

[values.manner]
stop              = 1.0
affricate         = 0.9
fricative         = 0.85
lateral_fricative = 0.8
trill             = 0.7
tap               = 0.65
lateral_flap      = 0.6
approximant       = 0.6
high_vowel        = 0.4
mid_vowel         = 0.2
low_vowel         = 0.0
vowel             = 0.5

[values.high]
high      = 1.0
near_high = 0.85
high_mid  = 0.65
mid       = 0.5
low_mid   = 0.35
near_low  = 0.15
low       = 0.0

[values.back]
front      = 1.0
near_front = 0.75
central    = 0.5
near_back  = 0.25
back       = 0.0

[values.binary]
plus  = 1.0
minus = 0.0

[values.phonation]
modal   = 1.0
breathy = 0.75
creaky  = 0.5
stiff   = 0.25
slack   = 0.0

[values.airstream]
pulmonic  = 1.0
ejective  = 0.66
implosive = 0.33
click     = 0.0

[values.secondary]
none           = 1.0
labialized     = 0.75
palatalized    = 0.5
velarized      = 0.25
pharyngealized = 0.0

